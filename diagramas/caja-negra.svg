="#555555">Combinación de FC de MYCIN · veto = −1</text><text x="620" y="704" font-family="Helvetica" font-size="13.5" font-weight="normal" text-anchor="middle" fill="#555555">N = 5 hipótesis en el ranking</text><polyline points="620,610 620,520" fill="none" stroke="#1a1a1a" stroke-width="1.6"/><polygon points="620,520 624.5,530.0 615.5,530.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.4"/><rect x="900" y="150" width="310" height="470" rx="0" fill="white" stroke="#1a1a1a" stroke-width="1.6"/><rect x="900" y="150" width="310" height="44" rx="0" fill="#f4f7f5" stroke="#1a1a1a" stroke-width="1.6"/><text x="1055" y="178" font-family="Helvetica" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">SALIDAS</text><text x="920" y="224" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="start" fill="#1a1a1a">1.</text><text x="944" y="224" font-family="Helvetica" font-size="14.5" font-weight="normal" text-anchor="start" fill="#1a1a1a">Top 5 hipótesis con factor</text><text x="944" y="243" font-family="Helvetica" font-size="14.5" font-weight="normal" text-anchor="start" fill="#1a1a1a">de certeza (FC) y peso (%)</text><text x="920" y="277" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="start" fill="#1a1a1a">2.</text><text x="944" y="277" font-family="Helvetica" font-size="14.5" font-weight="normal" text-anchor="start" fill="#1a1a1a">Estado de cada hipótesis</text><text x="944" y="296" font-family="Helvetica" font-size="14.5" font-weight="normal" text-anchor="start" fill="#1a1a1a">(recomendada / opcional)</text><text x="920" y="330" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="start" fill="#1a1a1a">3.</text><text x="944" y="330" font-family="Helvetica" font-size="14.5" font-weight="normal" text-anchor="start" fill="#1a1a1a">Explicación: reglas a favor</text><text x="944" y="349" font-family="Helvetica" font-size="14.5" font-weight="normal" text-anchor="start" fill="#1a1a1a">y en con