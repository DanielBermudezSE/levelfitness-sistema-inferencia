<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760"><rect width="1240" height="760" fill="white"/><rect x="30" y="150" width="310" height="470" rx="0" fill="white" stroke="#1a1a1a" stroke-width="1.6"/><rect x="30" y="150" width="310" height="44" rx="0" fill="#f4f7f5" stroke="#1a1a1a" stroke-width="1.6"/><text x="185" y="178" font-family="Helvetica" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">ENTRADAS (respuestas del usuario)</text><text x="52" y="222.0" font-family="Helvetica" font-size="14.5" font-weight="normal" text-anchor="start" fill="#1a1a1a"> 1.  Objetivo</text><text x="52" y="248.5" font-family="Helvetica" font-size="14.5" font-weight="normal" text-anchor="start" fill="#1a1a1a"> 2.  Sexo biológico</text><text x="52" y="275.0" font-family="Helvetica" font-size="14.5" font-weight="normal" text-anchor="start" fill="#1a1a1a"> 3.  Edad</text><text x="52" y="301.5" font-family="Helvetica" font-size="14.5" font-weight="normal" text-anchor="start" fill="#1a1a1a"> 4.  Peso (kg)</text><text x="52" y="328.0" font-family="Helvetica" font-size="14.5" font-weight="normal" text-anchor="start" fill="#1a1a1a"> 5.  Estatura (cm)</text><text x="52" y="354.5" font-family="Helvetica" font-size="14.5" font-weight="normal" text-anchor="start" fill="#1a1a1a"> 6.  Experiencia</text><text x="52" y="381.0" font-family="Helvetica" font-size="14.5" font-weight="normal" text-anchor="start" fill="#1a1a1a"> 7.  Frecuencia semanal</text><text x="52" y="407.5" font-family="Helvetica" font-size="14.5" font-weight="normal" text-anchor="start" fill="#1a1a1a"> 8.  Duración de la sesión</text><text x="52" y="434.0" font-family="Helvetica" font-size="14.5" font-weight="normal" text-anchor="start" fill="#1a1a1a"> 9.  Tipo de entrenamiento</text><text x="52" y="460.5" font-family="Helvetica" font-size="14.5" font-weight="normal" text-anchor="start" fill="#1a1a1a">10.  Horario de entrenamiento</text><text x="52" y="487.0" font-family="Helvetica" font-size="14.5" font-weight="normal" text-anchor="start" fill="#1a1a1a">11.  Tipo de dieta</text><text x="52" y="513.5" font-family="Helvetica" font-size="14.5" font-weight="normal" text-anchor="start" fill="#1a1a1a">12.  Proteína en la dieta</text><text x="52" y="540.0" font-family="Helvetica" font-size="14.5" font-weight="normal" text-anchor="start" fill="#1a1a1a">13.  Metabolismo</text><text x="52" y="566.5" font-family="Helvetica" font-size="14.5" font-weight="normal" text-anchor="start" fill="#1a1a1a">14.  Condiciones de salud (múltiple)</text><text x="52" y="593.0" font-family="Helvetica" font-size="14.5" font-weight="normal" text-anchor="start" fill="#1a1a1a">15.  Presupuesto (COP)</text><rect x="450" y="250" width="340" height="270" rx="6" fill="#111111" stroke="#111111" stroke-width="1.6"/><text x="620" y="350" font-family="Helvetica" font-size="22" font-weight="bold" text-anchor="middle" fill="white">SISTEMA DE INFERENCIA</text><text x="620" y="380" font-family="Helvetica" font-size="22" font-weight="bold" text-anchor="middle" fill="white">GRANULAR</text><text x="620" y="430" font-family="Helvetica" font-size="16" font-weight="normal" text-anchor="middle" fill="#cccccc" font-style="italic">(caja negra)</text><polyline points="340,385 450,385" fill="none" stroke="#1a1a1a" stroke-width="1.6"/><polygon points="450,385 440.0,389.5 440.0,380.5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.4"/><text x="395" y="372" font-family="Helvetica" font-size="14" font-weight="normal" text-anchor="middle" fill="#555555" font-style="italic">x₁ … x₁₅</text><path d="M470,44 L470,138 A150,18 0 0 0 770,138 L770,44" fill="#f4f7f5" stroke="#1a1a1a" stroke-width="1.6"/><ellipse cx="620" cy="44" rx="150" ry="18" fill="white" stroke="#1a1a1a" stroke-width="1.6"/><text x="620" y="86" font-family="Helvetica" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Base de conocimiento (PostgreSQL)</text><text x="620" y="110" font-family="Helvetica" font-size="